<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Design — Yury Kopytov</title>
  <meta
    name="description"
    content="Selected graphic design and publishing work from Yury Kopytov's time at the Moscow Museum of Modern Art."
  >
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      background: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
    }

    html {
      min-height: 100%;
      background: #000000;
      scrollbar-color: #565656 #000000;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      text-rendering: geometricPrecision;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      font-weight: 700;
    }

    .gallery {
      --gallery-gap: clamp(12px, 1.15vw, 24px);
      display: block;
      column-width: 180px;
      column-gap: var(--gallery-gap);
      width: 100%;
      min-height: 100vh;
      padding: clamp(16px, 1.5vw, 30px) clamp(14px, 1.5vw, 30px) 92px;
    }

    .gallery-item {
      display: inline-block;
      min-width: 0;
      min-height: 0;
      width: 100%;
      margin: 0 0 var(--gallery-gap);
      overflow: hidden;
      break-inside: avoid;
      vertical-align: top;
    }

    .gallery-item.is-empty {
      visibility: hidden;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      min-width: 0;
      min-height: 0;
    }

    .designer-control {
      position: fixed;
      z-index: 10;
      left: max(14px, env(safe-area-inset-left));
      bottom: max(14px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .designer-control select {
      max-width: min(82vw, 360px);
      min-height: 30px;
      margin: 0;
      padding: 4px 2px;
      border: 0;
      border-radius: 0;
      background: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .designer-control select:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .gallery {
        column-width: 150px;
      }
    }

    @media (max-width: 560px) {
      .gallery {
        --gallery-gap: 10px;
        column-count: 2;
        column-width: auto;
        padding: 12px 10px 82px;
      }

      .designer-control {
        left: max(10px, env(safe-area-inset-left));
        bottom: max(10px, env(safe-area-inset-bottom));
        max-width: calc(100vw - 20px);
        font-size: 12px;
      }

      .designer-control select {
        min-width: 0;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section
      class="gallery"
      id="design-gallery"
      aria-label="Graphic design gallery"
    ></section>
  </main>

  <div class="designer-control">
    <select id="designer-filter" aria-label="Designers" autocomplete="off">
      <option value="all" selected>designers</option>
      <option value="ostengruppe">kirill blagodatskih (ostengruppe)</option>
      <option value="text-pictures">max spivakov (text and pictures)</option>
      <option value="gornitsky">roman gornitsky (the temporary state)</option>
      <option value="cyan">daniela haufe &amp; detlef fiedler (cyan)</option>
    </select>
    <span class="sr-only" id="filter-status" aria-live="polite"></span>
  </div>

  <script>
    (() => {
      const gallery = document.querySelector("#design-gallery");
      const designerFilter = document.querySelector("#designer-filter");
      const filterStatus = document.querySelector("#filter-status");

      const designers = [
        {
          id: "cyan",
          name: "daniela haufe & detlef fiedler (cyan)",
          path: "thumbnails-balanced/cyan/cyan",
          count: 11,
          salt: 17,
        },
        {
          id: "ostengruppe",
          name: "kirill blagodatskih (ostengruppe)",
          path: "thumbnails-balanced/ostengruppe/ostengruppe",
          count: 22,
          salt: 31,
        },
        {
          id: "text-pictures",
          name: "max spivakov (text and pictures)",
          path: "thumbnails-balanced/text-pictures/text-pictures",
          count: 16,
          salt: 47,
        },
        {
          id: "gornitsky",
          name: "roman gornitsky (the temporary state)",
          path: "thumbnails-balanced/gornitsky/gornitsky",
          count: 31,
          exclude: [3, 10, 20],
          salt: 61,
        },
      ];

      const works = designers
        .flatMap((designer) =>
          Array.from({ length: designer.count }, (_, index) => index + 1)
            .filter((number) => !designer.exclude?.includes(number))
            .map((number) => ({
              designer,
              number,
              order:
                Math.sin(number * designer.salt * 12.9898) * 43758.5453,
            }))
        )
        .sort(
          (first, second) =>
            (first.order - Math.floor(first.order)) -
            (second.order - Math.floor(second.order))
        );

      const fragment = document.createDocumentFragment();

      works.forEach((work, index) => {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        const fileNumber = String(work.number).padStart(2, "0");

        figure.className = "gallery-item";
        figure.dataset.designer = work.designer.id;

        image.src = `${work.designer.path}-${fileNumber}.jpg`;
        image.alt = `Design work ${work.number} by ${work.designer.name}`;
        image.decoding = "async";
        image.loading = index < 14 ? "eager" : "lazy";

        figure.append(image);
        fragment.append(figure);
      });

      gallery.append(fragment);

      const applyFilter = () => {
        const selectedDesigner = designerFilter.value;
        let visibleCount = 0;

        gallery.querySelectorAll(".gallery-item").forEach((item) => {
          const shouldShow =
            selectedDesigner === "all" ||
            item.dataset.designer === selectedDesigner;

          item.classList.toggle("is-empty", !shouldShow);
          item.setAttribute("aria-hidden", String(!shouldShow));
          visibleCount += shouldShow ? 1 : 0;
        });

        const selectedLabel =
          designerFilter.options[designerFilter.selectedIndex].text;
        filterStatus.textContent =
          selectedDesigner === "all"
            ? `Showing all ${visibleCount} works`
            : `Showing ${visibleCount} works by ${selectedLabel}`;
      };

      const resetFilter = () => {
        designerFilter.value = "all";
        applyFilter();
      };

      designerFilter.addEventListener("change", applyFilter);
      window.addEventListener("pageshow", resetFilter);
      resetFilter();
    })();
  </script>
</body>
</html>
